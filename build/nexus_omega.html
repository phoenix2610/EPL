<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1.0">
  <title>NEXUS OMEGA</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="nexus_omega.style.css">
</head>
<body>
<div id="epl-root">
  <canvas id="epl-canvas"></canvas>

  <div id='epl-tt'></div>

  <!-- Detail panel -->
  <div id='epl-panel'>
    <div class='ep-head'>
      <div class='ep-title' id='ep-title'>—</div>
      <div class='ep-close' id='ep-close'>×</div>
    </div>
    <div class='ep-body'>
      <div id='ep-badge' class='ep-badge'></div>
      <div class='ep-div'></div>
      <div class='ep-row'>
        <span class='ep-key'>Ring</span>
        <span class='ep-val' id='ep-ring'>—</span>
      </div>
      <div class='ep-row'>
        <span class='ep-key'>Status</span>
        <span class='ep-val' id='ep-status'>—</span>
      </div>
      <div class='ep-div'></div>
      <div class='ep-desc' id='ep-desc'>—</div>
    </div>
  </div>

  <div class='epl-overlay-panel ep-panel-right'>
    <h1 class='ep-panel-h1'>NEXUS OMEGA</h1>
    <h2 class='ep-panel-h2'>Galactic Intelligence Grid</h2>
  </div>

  <div id="epl-legend"></div>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="nexus_omega.data.js"></script>
<script src="nexus_omega.scene.js"></script>
</body>
</html>
